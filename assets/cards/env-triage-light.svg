<text x="26" y="114" class="m" font-size="12"><tspan fill="#cf222e">✗ </tspan><tspan fill="#1f2328" font-weight="700">SENTRY_DSN      </tspan><tspan fill="#59636e">missing from .env</tspan></text>
<text x="26" y="133" class="m" font-size="12"><tspan fill="#cf222e">✗ </tspan><tspan fill="#1f2328" font-weight="700">SESSION_SECRET  </tspan><tspan fill="#59636e">is still a placeholder value</tspan></text>
