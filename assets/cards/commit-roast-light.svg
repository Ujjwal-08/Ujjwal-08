<svg xmlns="http://www.w3.org/2000/svg" width="400" height="214" viewBox="0 0 400 214" role="img" aria-label="commit-roast: Roasts your git commit messages. Offline, no AI.">
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', monospace;white-space:pre}.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', sans-serif}</style>
<rect x=".5" y=".5" width="399" height="213" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="35" class="s" font-size="16" font-weight="600" fill="#1f2328">commit-roast</text>
<text x="380" y="34" class="m" font-size="11" text-anchor="end" fill="#818b98">npx</text>
<text x="20" y="57" class="s" font-size="12.5" fill="#59636e">Roasts your git commit messages. Offline, no AI.</text>
<rect x="12" y="72" width="376" height="130" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-opacity=".7"/>
<text x="26" y="95" class="m" font-size="12"><tspan fill="#818b98">$ </tspan><tspan fill="#1f2328" font-weight="700">npx commit-roast</tspan></text>
<text x="26" y="114" class="m" font-size="12"><tspan fill="#cf222e">✖ </tspan><tspan fill="#1f2328">4 subjects run past 72 characters — that is</tspan></text>
<text x="26" y="133" class="m" font-size="12"><tspan fill="#1f2328">  not a subject, that is the body wearing a</tspan></text>
<text x="26" y="152" class="m" font-size="12"><tspan fill="#1f2328">  subject's coat.</tspan></text>
<text x="26" y="171" class="m" font-size="12"><tspan fill="#59636e">score 85/100 </tspan><tspan fill="#b8442b">[█████████████████</tspan><tspan fill="#818b98">░░░]</tspan><tspan fill="#1a7f37" font-weight="700"> grade A</tspan></text>

</svg>
