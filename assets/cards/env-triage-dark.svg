<text x="26" y="114" class="m" font-size="12"><tspan fill="#ff7b72">✗ </tspan><tspan fill="#e6edf3" font-weight="700">SENTRY_DSN      </tspan><tspan fill="#9198a1">missing from .env</tspan></text>
<text x="26" y="133" class="m" font-size="12"><tspan fill="#ff7b72">✗ </tspan><tspan fill="#e6edf3" font-weight="700">SESSION_SECRET  </tspan><tspan fill="#9198a1">is still a placeholder value</tspan></text>
